spring.application.name=Sunrise Dental Clinic

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server.port=${SERVER_PORT:8080}


# ---------------------------------------------------------------------------
# Database (MySQL)
#
# No credentials are written in this file. Each value falls back to a local
# development default only when the environment variable is not set, so the
# real username and password never enter Git. See README.md and .env.example.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sunrise_dental}?createDatabaseIfNotExist=true&serverTimezone=Asia/Colombo
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate must never create or alter tables here. Our own SQL scripts own the
# schema, because the assessment requires stored procedures and triggers, which
# Hibernate cannot generate.
#
# Now that the JPA entities exist (step 3), this is "validate". At start-up
# Hibernate compares every entity against the real tables and refuses to start
# if they disagree - for example if a column was renamed in schema.sql but not
# in the entity. That turns a silent bug into an obvious start-up error.
#
# Set JPA_DDL_AUTO=none to start the application without that check.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# The database is built by our scripts, in this order:
#   schema.sql     - tables, keys, constraints
#   procedures.sql - stored functions and procedures
#   triggers.sql   - business-rule and audit triggers
#   data.sql       - reference data (settings, staff logins, dentists, prices)
#
# Every script is safe to run again, so leaving this on "always" simply keeps the
# database up to date on each start. Set SQL_INIT_MODE=never to skip it.
#
# The separator is ";;" and not ";", because a stored procedure body contains
# single semicolons inside it. See the note at the top of db/schema.sql.
#
# db/demo-data.sql is deliberately NOT listed: it deletes and recreates sample
# patients, so it is run by hand only. See its header for instructions.
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:db/schema.sql,classpath:db/procedures.sql,classpath:db/triggers.sql
spring.sql.init.data-locations=classpath:db/data.sql
spring.sql.init.separator=;;
spring.sql.init.continue-on-error=false

# The SQL scripts must run BEFORE Hibernate starts, not after.
#
# Hibernate is now set to "validate", and it can only validate tables that
# already exist. Leaving this on true would delay schema.sql until after that
# check, so the very first start on a clean MySQL would fail.
spring.jpa.defer-datasource-initialization=false


# ---------------------------------------------------------------------------
# Sessions and cookies (assessed requirement)
# ---------------------------------------------------------------------------
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=SUNRISEID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set to true once the app is served over HTTPS in deployment
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}


# ---------------------------------------------------------------------------
# Thymeleaf views
# ---------------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html


# ---------------------------------------------------------------------------
# Email reminders (FR7). Left disabled until real credentials are supplied.
# ---------------------------------------------------------------------------
clinic.notifications.email.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# ---------------------------------------------------------------------------
# Appointment reminders (FR7)
#
# The nightly round is switched on here and off in application-test.properties,
# because a timed job that fires in the middle of the test suite makes failures
# look random.
#
# Six in the evening suits a clinic that closes at six. That is a business
# decision, not a programming one, so it is a setting rather than a constant.
# ---------------------------------------------------------------------------
clinic.reminders.scheduled=${REMINDERS_SCHEDULED:true}
clinic.reminders.cron=${REMINDERS_CRON:0 0 18 * * *}


# ---------------------------------------------------------------------------
# Clinic business values, read by the Singleton configuration holder
# ---------------------------------------------------------------------------
clinic.name=Sunrise Dental Clinic
clinic.city=Colombo
clinic.consultation-fee=1500.00
clinic.opening-time=08:00
clinic.closing-time=18:00
clinic.appointment-slot-minutes=30


# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.lk.icbt.cis6003.dentalclinic=DEBUG
logging.level.org.springframework.security=INFO
