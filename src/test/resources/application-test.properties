# Test configuration.
#
# Tests must never touch the real clinic database, and must run on a machine that
# has no MySQL installed (for example the GitHub Actions build server). So the tests
# use H2, a small database that lives in memory and disappears when the test ends.
#
# MODE=MySQL makes H2 understand MySQL syntax, so the same entity mappings work.

spring.datasource.url=jdbc:h2:mem:sunrise_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate build the tables from the entities for tests.
# Stored procedures and triggers are tested separately against real MySQL.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.sql.init.mode=never

# No emails are sent during tests
clinic.notifications.email.enabled=false

logging.level.lk.icbt.cis6003.dentalclinic=INFO
