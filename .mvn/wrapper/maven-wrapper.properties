# Maven Wrapper.
# This lets anyone build the project with ./mvnw (Linux/Mac) or mvnw.cmd (Windows)
# without installing Maven first. The wrapper downloads the Maven version below
# on the first build, so the marker and the GitHub Actions server both use
# exactly the same Maven version.
wrapperVersion=3.3.2
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
